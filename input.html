<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>サロンヘルスチェック</title>
    <link rel="stylesheet" href="./styles.css" />
    <style>
      .input-page {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 40px 20px;
      }

      .input-card {
        background: var(--paper);
        border-radius: 16px;
        box-shadow: var(--shadow);
        padding: 56px 64px;
        width: 100%;
        max-width: 560px;
      }

      .input-card .eyebrow { margin-bottom: 8px; }

      .input-card h1 {
        font-size: 36px;
        font-weight: 900;
        letter-spacing: -0.01em;
        line-height: 1.1;
        margin: 0 0 8px;
        color: var(--ink);
      }

      .input-card .desc {
        color: var(--muted);
        font-size: 15px;
        line-height: 1.6;
        margin: 0 0 40px;
      }

      .field {
        display: grid;
        gap: 8px;
        margin-bottom: 20px;
      }

      .field label {
        font-size: 13px;
        font-weight: 700;
        color: var(--ink);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .field label .optional {
        font-size: 11px;
        font-weight: 500;
        color: var(--muted);
        background: #f0f0ee;
        border-radius: 4px;
        padding: 2px 6px;
      }

      .field input {
        width: 100%;
        padding: 14px 16px;
        border: 1.5px solid var(--line);
        border-radius: 10px;
        font-size: 16px;
        font-family: "Noto Sans JP", "Hiragino Sans", Meiryo, system-ui, sans-serif;
        color: var(--ink);
        background: white;
        transition: border-color 0.15s;
        outline: none;
        box-sizing: border-box;
      }

      .field input:focus { border-color: var(--teal); }
      .field input::placeholder { color: #b0b8c0; }

      /* 店舗ブロック */
      .store-block {
        background: white;
        border: 1.5px solid var(--line);
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 12px;
        position: relative;
      }

      .store-block-label {
        font-size: 12px;
        font-weight: 800;
        color: var(--teal-dark);
        letter-spacing: 0.04em;
        margin-bottom: 12px;
      }

      .remove-btn {
        position: absolute;
        top: 14px;
        right: 14px;
        background: none;
        border: 1.5px solid var(--line);
        border-radius: 6px;
        color: var(--muted);
        cursor: pointer;
        font-size: 12px;
        font-weight: 700;
        min-height: 28px;
        padding: 0 10px;
      }

      .remove-btn:hover {
        border-color: var(--coral);
        color: var(--coral);
        background: var(--rose);
      }

      /* 追加ボタン */
      .add-store-btn {
        width: 100%;
        padding: 14px;
        background: none;
        border: 1.5px dashed var(--teal);
        border-radius: 10px;
        color: var(--teal-dark);
        cursor: pointer;
        font-size: 15px;
        font-weight: 700;
        font-family: "Noto Sans JP", "Hiragino Sans", Meiryo, system-ui, sans-serif;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: background 0.15s, border-color 0.15s;
        min-height: auto;
      }

      .add-store-btn:hover {
        background: var(--mint);
      }

      .add-store-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      /* 比較モード表示 */
      .compare-notice {
        background: var(--mint);
        border-radius: 8px;
        color: var(--teal-dark);
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 16px;
        padding: 10px 14px;
        display: none;
      }

      .compare-notice.visible { display: block; }

      .submit-btn {
        width: 100%;
        padding: 18px;
        background: var(--teal);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 17px;
        font-weight: 700;
        font-family: "Noto Sans JP", "Hiragino Sans", Meiryo, system-ui, sans-serif;
        cursor: pointer;
        margin-top: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transition: background 0.15s;
        min-height: auto;
      }

      .submit-btn:hover { background: var(--teal-dark); }

      /* ローディング */
      .loading-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(238, 242, 241, 0.92);
        place-items: center;
        z-index: 100;
        flex-direction: column;
        gap: 24px;
      }

      .loading-overlay.active { display: grid; }

      .loading-card {
        background: white;
        border-radius: 16px;
        box-shadow: var(--shadow);
        padding: 48px 56px;
        text-align: center;
        display: grid;
        gap: 20px;
        min-width: 300px;
      }

      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid var(--mint);
        border-top-color: var(--teal);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto;
      }

      @keyframes spin { to { transform: rotate(360deg); } }

      .loading-card h2 {
        font-size: 22px;
        font-weight: 700;
        margin: 0;
        color: var(--ink);
      }

      .loading-card p {
        font-size: 14px;
        color: var(--muted);
        margin: 0;
      }

      .loading-progress {
        font-size: 13px;
        color: var(--teal-dark);
        font-weight: 700;
      }

      @media (max-width: 600px) {
        .input-card { padding: 36px 28px; }
        .input-card h1 { font-size: 28px; }
      }
    </style>
  </head>
  <body>
    <div class="input-page">
      <div class="input-card">
        <p class="eyebrow">Salon Health Check</p>
        <h1>サロン診断</h1>
        <p class="desc">店舗名を入力するだけで、集客導線・口コミ・ホームページの改善ポイントを自動で診断します。複数店舗を追加すると比較診断ができます。</p>

        <!-- 店舗リスト -->
        <div id="storeList"></div>

        <!-- 店舗追加ボタン -->
        <button class="add-store-btn" id="addStoreBtn" type="button">
          <span>＋ 比較する店舗を追加</span>
          <span style="font-size:11px;font-weight:500;opacity:0.7">最大5店舗</span>
        </button>

        <!-- 比較モード通知 -->
        <div class="compare-notice" id="compareNotice">
          複数店舗が入力されています。診断後に比較レポートが表示されます。
        </div>

        <button class="submit-btn" id="diagnoseBtn" type="button">
          <span id="submitLabel">診断する</span>
          <span aria-hidden="true">→</span>
        </button>
      </div>
    </div>

    <!-- ローディング -->
    <div class="loading-overlay" id="loadingOverlay">
      <div class="loading-card">
        <div class="spinner"></div>
        <h2>診断中</h2>
        <p id="loadingDetail">GoogleMap・ホームページの情報を取得しています…</p>
        <p class="loading-progress" id="loadingProgress"></p>
      </div>
    </div>

    <script>
      const MAX_STORES = 5;
      let storeCount = 0;

      function createStoreBlock(index) {
        const block = document.createElement("div");
        block.className = "store-block";
        block.dataset.index = index;
        block.innerHTML = `
          <p class="store-block-label">店舗 ${index + 1}</p>
          ${index > 0 ? `<button class="remove-btn" type="button" onclick="removeStore(this)">削除</button>` : ""}
          <div class="field">
            <label>店舗名</label>
            <input type="text" class="store-name" placeholder="例：サロン〇〇" autocomplete="off" />
          </div>
          <div class="field">
            <label>ジャンル <span class="optional">任意</span></label>
            <input type="text" class="store-genre" placeholder="例：エステ、ヘアサロン、ネイル" autocomplete="off" />
          </div>
        `;
        return block;
      }

      function addStore() {
        if (storeCount >= MAX_STORES) return;
        const list = document.getElementById("storeList");
        list.appendChild(createStoreBlock(storeCount));
        storeCount++;
        updateUI();
      }

      function removeStore(btn) {
        const block = btn.closest(".store-block");
        block.remove();
        storeCount--;
        // ラベルを振り直す
        document.querySelectorAll(".store-block").forEach((b, i) => {
          b.dataset.index = i;
          b.querySelector(".store-block-label").textContent = `店舗 ${i + 1}`;
        });
        updateUI();
      }

      function updateUI() {
        const count = document.querySelectorAll(".store-block").length;
        document.getElementById("addStoreBtn").disabled = count >= MAX_STORES;
        document.getElementById("compareNotice").classList.toggle("visible", count >= 2);
        document.getElementById("submitLabel").textContent = count >= 2 ? `${count}店舗を比較診断` : "診断する";
      }

      // 初期1店舗を追加
      addStore();

      document.getElementById("addStoreBtn").addEventListener("click", addStore);
      document.getElementById("diagnoseBtn").addEventListener("click", runDiagnosis);

      async function runDiagnosis() {
        const blocks = document.querySelectorAll(".store-block");
        const stores = Array.from(blocks).map(b => ({
          name: b.querySelector(".store-name").value.trim(),
          genre: b.querySelector(".store-genre").value.trim(),
        })).filter(s => s.name);

        if (stores.length === 0) {
          document.querySelector(".store-name").focus();
          return;
        }

        const overlay = document.getElementById("loadingOverlay");
        const detail = document.getElementById("loadingDetail");
        const progress = document.getElementById("loadingProgress");
        overlay.classList.add("active");

        try {
          const reports = [];

          for (let i = 0; i < stores.length; i++) {
            const store = stores[i];
            detail.textContent = `「${store.name}」の情報を取得しています…`;
            progress.textContent = stores.length > 1 ? `${i + 1} / ${stores.length} 店舗` : "";

            // ① Places API
            const placesRes = await fetch("/.netlify/functions/places", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ storeName: store.name, genre: store.genre }),
            });
            if (!placesRes.ok) {
              const err = await placesRes.json();
              throw new Error(`${store.name}: ${err.error || "店舗情報の取得に失敗しました"}`);
            }
            const placeData = await placesRes.json();

            // ② Analyze API
            detail.textContent = `「${store.name}」を診断しています…`;
            const analyzeRes = await fetch("/.netlify/functions/analyze", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ placeData }),
            });
            if (!analyzeRes.ok) {
              const err = await analyzeRes.json();
              throw new Error(`${store.name}: ${err.error || "診断の生成に失敗しました"}`);
            }
            const analysis = await analyzeRes.json();

            const report = {
              brand: "サロンヘルスチェック",
              storeName: placeData.storeName,
              storeShortName: placeData.storeName,
              area: placeData.address,
              diagnosisDate: new Date().toLocaleDateString("ja-JP", { year: "numeric", month: "2-digit" }).replace("/", "."),
              map: {
                rating: placeData.rating,
                areaRating: placeData.areaRating,
                reviews: placeData.reviews,
                areaReviews: placeData.areaReviews,
                nextReviewGoal: placeData.reviews ? Math.ceil(placeData.reviews / 5) * 5 + 5 : 30,
              },
              homepageChecks: analysis.homepageChecks || [],
              priorities: analysis.priorities || [],
              superiorStores: placeData.superiorStores || [],
              nearbyCompetitors: placeData.nearbyCompetitors || [],
              summary: analysis.summary || "",
              closing: analysis.closing || "",
              offer: analysis.offer || { title: "初回改善サポート", items: [], cta: "まずここから着手しましょう" },
            };

            reports.push(report);
          }

          if (reports.length === 1) {
            // 単店舗：従来通り
            sessionStorage.setItem("salonReport", JSON.stringify(reports[0]));
            window.location.href = "./index.html";
          } else {
            // 複数店舗：比較ページへ
            sessionStorage.setItem("salonReports", JSON.stringify(reports));
            window.location.href = "./compare.html";
          }

        } catch (err) {
          overlay.classList.remove("active");
          alert("エラーが発生しました：" + err.message);
        }
      }
    </script>
  </body>
</html>
